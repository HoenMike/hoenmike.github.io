name: Portfolio checks
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Portfolio contract tests
        run: node --test tests/*.test.mjs
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
      - name: Responsive and interaction QA
        run: node tests/browser-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: artifacts/*.png
          if-no-files-found: ignore
